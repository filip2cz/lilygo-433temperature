[platformio]
default_envs = ttgo_lora32_v21

[env:ttgo_lora32_v21]
platform = espressif32@6.1.0
board = ttgo-lora32-v21
framework = arduino
board_build.partitions = huge_app.csv

monitor_speed = 115200
upload_speed = 921600

build_flags =
    '-DLOG_LEVEL=LOG_LEVEL_NOTICE'
    '-DRF_SX1278="SX1278"'
    '-DRF_MODULE_FREQUENCY=433.92'
    '-DOOK_FIXED_THRESHOLD=0x50'
    '-DRF_MODULE_DIO0=26'
    '-DRF_MODULE_DIO1=33'
    '-DRF_MODULE_DIO2=32'
    '-DRF_MODULE_RST=23'
    '-DRF_MODULE_CS=18'

lib_deps =
    bblanchon/ArduinoJson@^7.0.4
    https://github.com/1technophile/Arduino-Log.git#d13cd80aa02c8cf79a33ca24c554ed3331c3679f
    https://github.com/NorthernMan54/rtl_433_ESP.git
    adafruit/Adafruit SSD1306@^2.5.9
    adafruit/Adafruit GFX Library@^1.11.9
